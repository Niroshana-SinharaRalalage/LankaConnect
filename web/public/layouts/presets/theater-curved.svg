<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Theater Curved: curved front rows and rear section">
  <rect width="1200" height="800" fill="#f9fafb"/>
  <rect x="300" y="20" width="600" height="80" rx="10" fill="#1f2937"/>
  <text x="600" y="72" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="600" fill="#f9fafb" text-anchor="middle">STAGE</text>
  <!-- Curved front (drawn as 4 arcs) -->
  <g fill="none" stroke="#3b82f6" stroke-width="12">
    <path d="M 220 500 A 380 380 0 0 1 980 500" opacity="0.9"/>
    <path d="M 260 470 A 340 340 0 0 1 940 470" opacity="0.7"/>
    <path d="M 300 440 A 300 300 0 0 1 900 440" opacity="0.55"/>
    <path d="M 340 410 A 260 260 0 0 1 860 410" opacity="0.4"/>
  </g>
  <text x="600" y="540" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="600" fill="#1e40af" text-anchor="middle">Front (Curved)</text>
  <!-- Rear rect -->
  <rect x="100" y="570" width="1000" height="210" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/>
  <text x="600" y="695" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="600" fill="#374151" text-anchor="middle">Rear</text>
</svg>
