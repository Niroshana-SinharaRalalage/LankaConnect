<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Theater with Balcony: Orchestra + Mezzanine + Balcony sections">
  <rect width="1200" height="800" fill="#f9fafb"/>
  <rect x="300" y="20" width="600" height="80" rx="10" fill="#1f2937"/>
  <text x="600" y="72" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="600" fill="#f9fafb" text-anchor="middle">STAGE</text>
  <!-- Orchestra -->
  <rect x="100" y="140" width="1000" height="320" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
  <text x="600" y="308" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="600" fill="#1e40af" text-anchor="middle">Orchestra</text>
  <!-- Mezzanine -->
  <rect x="100" y="480" width="1000" height="200" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/>
  <text x="600" y="590" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="600" fill="#6d28d9" text-anchor="middle">Mezzanine</text>
  <!-- Balcony -->
  <rect x="100" y="700" width="1000" height="80" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="3"/>
  <text x="600" y="752" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600" fill="#be185d" text-anchor="middle">Balcony</text>
</svg>
