<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Banquet Mixed: 10 round tables + 5 rectangular head tables + dance floor">
  <rect width="1200" height="800" fill="#f9fafb"/>
  <rect x="400" y="20" width="400" height="60" rx="10" fill="#1f2937"/>
  <text x="600" y="60" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600" fill="#f9fafb" text-anchor="middle">STAGE</text>
  <!-- 5 rect head tables under the stage -->
  <g fill="#fee2e2" stroke="#ef4444" stroke-width="3">
    <rect x="100" y="95" width="160" height="60" rx="4"/>
    <rect x="320" y="95" width="160" height="60" rx="4"/>
    <rect x="540" y="95" width="160" height="60" rx="4"/>
    <rect x="760" y="95" width="160" height="60" rx="4"/>
    <rect x="980" y="95" width="160" height="60" rx="4"/>
  </g>
  <text x="600" y="180" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#b91c1c" text-anchor="middle">Head Tables</text>
  <!-- Dance floor in the middle -->
  <rect x="350" y="270" width="500" height="160" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="600" y="360" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="600" fill="#b45309" text-anchor="middle">Dance Floor</text>
  <!-- 10 round tables below, 2 rows × 5 cols -->
  <g fill="#fde68a" stroke="#d97706" stroke-width="3">
    <circle cx="140" cy="520" r="55"/>
    <circle cx="360" cy="520" r="55"/>
    <circle cx="580" cy="520" r="55"/>
    <circle cx="800" cy="520" r="55"/>
    <circle cx="1020" cy="520" r="55"/>
    <circle cx="140" cy="690" r="55"/>
    <circle cx="360" cy="690" r="55"/>
    <circle cx="580" cy="690" r="55"/>
    <circle cx="800" cy="690" r="55"/>
    <circle cx="1020" cy="690" r="55"/>
  </g>
</svg>
