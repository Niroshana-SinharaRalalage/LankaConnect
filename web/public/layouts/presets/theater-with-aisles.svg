<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Theater with Aisles: Left + Center + Right sections with two aisles">
  <rect width="1200" height="800" fill="#f9fafb"/>
  <rect x="300" y="20" width="600" height="80" rx="10" fill="#1f2937"/>
  <text x="600" y="72" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="600" fill="#f9fafb" text-anchor="middle">STAGE</text>
  <!-- Left section -->
  <rect x="60" y="140" width="300" height="600" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="3"/>
  <text x="210" y="450" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="600" fill="#047857" text-anchor="middle">Left</text>
  <!-- Aisle 1 -->
  <rect x="370" y="140" width="20" height="600" fill="#e5e7eb"/>
  <!-- Center section -->
  <rect x="400" y="140" width="400" height="600" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
  <text x="600" y="450" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="600" fill="#1e40af" text-anchor="middle">Center</text>
  <!-- Aisle 2 -->
  <rect x="810" y="140" width="20" height="600" fill="#e5e7eb"/>
  <!-- Right section -->
  <rect x="840" y="140" width="300" height="600" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <text x="990" y="450" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="600" fill="#b45309" text-anchor="middle">Right</text>
</svg>
