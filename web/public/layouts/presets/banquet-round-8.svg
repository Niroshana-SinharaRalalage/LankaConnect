<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Banquet 15 round tables × 8 seats each">
  <rect width="1200" height="800" fill="#f9fafb"/>
  <rect x="400" y="20" width="400" height="60" rx="10" fill="#1f2937"/>
  <text x="600" y="60" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600" fill="#f9fafb" text-anchor="middle">STAGE</text>
  <!-- 15 round tables: 3 rows × 5 cols. Centers at (140+c*220, 160+r*210), radius 55 -->
  <g>
    <!-- Row 0 -->
    <g><circle cx="140" cy="160" r="55" fill="#fde68a" stroke="#d97706" stroke-width="3"/><g fill="#b45309"><circle cx="195" cy="160" r="8"/><circle cx="184" cy="199" r="8"/><circle cx="155" cy="215" r="8"/><circle cx="125" cy="215" r="8"/><circle cx="96" cy="199" r="8"/><circle cx="85" cy="160" r="8"/><circle cx="125" cy="105" r="8"/><circle cx="155" cy="105" r="8"/></g></g>
    <g><circle cx="360" cy="160" r="55" fill="#fde68a" stroke="#d97706" stroke-width="3"/><g fill="#b45309"><circle cx="415" cy="160" r="8"/><circle cx="404" cy="199" r="8"/><circle cx="375" cy="215" r="8"/><circle cx="345" cy="215" r="8"/><circle cx="316" cy="199" r="8"/><circle cx="305" cy="160" r="8"/><circle cx="345" cy="105" r="8"/><circle cx="375" cy="105" r="8"/></g></g>
    <g><circle cx="580" cy="160" r="55" fill="#fde68a" stroke="#d97706" stroke-width="3"/><g fill="#b45309"><circle cx="635" cy="160" r="8"/><circle cx="624" cy="199" r="8"/><circle cx="595" cy="215" r="8"/><circle cx="565" cy="215" r="8"/><circle cx="536" cy="199" r="8"/><circle cx="525" cy="160" r="8"/><circle cx="565" cy="105" r="8"/><circle cx="595" cy="105" r="8"/></g></g>
    <g><circle cx="800" cy="160" r="55" fill="#fde68a" stroke="#d97706" stroke-width="3"/><g fill="#b45309"><circle cx="855" cy="160" r="8"/><circle cx="844" cy="199" r="8"/><circle cx="815" cy="215" r="8"/><circle cx="785" cy="215" r="8"/><circle cx="756" cy="199" r="8"/><circle cx="745" cy="160" r="8"/><circle cx="785" cy="105" r="8"/><circle cx="815" cy="105" r="8"/></g></g>
    <g><circle cx="1020" cy="160" r="55" fill="#fde68a" stroke="#d97706" stroke-width="3"/><g fill="#b45309"><circle cx="1075" cy="160" r="8"/><circle cx="1064" cy="199" r="8"/><circle cx="1035" cy="215" r="8"/><circle cx="1005" cy="215" r="8"/><circle cx="976" cy="199" r="8"/><circle cx="965" cy="160" r="8"/><circle cx="1005" cy="105" r="8"/><circle cx="1035" cy="105" r="8"/></g></g>
    <!-- Row 1 -->
    <g><circle cx="140" cy="370" r="55" fill="#fde68a" stroke="#d97706" stroke-width="3"/></g>
    <g><circle cx="360" cy="370" r="55" fill="#fde68a" stroke="#d97706" stroke-width="3"/></g>
    <g><circle cx="580" cy="370" r="55" fill="#fde68a" stroke="#d97706" stroke-width="3"/></g>
    <g><circle cx="800" cy="370" r="55" fill="#fde68a" stroke="#d97706" stroke-width="3"/></g>
    <g><circle cx="1020" cy="370" r="55" fill="#fde68a" stroke="#d97706" stroke-width="3"/></g>
    <!-- Row 2 -->
    <g><circle cx="140" cy="580" r="55" fill="#fde68a" stroke="#d97706" stroke-width="3"/></g>
    <g><circle cx="360" cy="580" r="55" fill="#fde68a" stroke="#d97706" stroke-width="3"/></g>
    <g><circle cx="580" cy="580" r="55" fill="#fde68a" stroke="#d97706" stroke-width="3"/></g>
    <g><circle cx="800" cy="580" r="55" fill="#fde68a" stroke="#d97706" stroke-width="3"/></g>
    <g><circle cx="1020" cy="580" r="55" fill="#fde68a" stroke="#d97706" stroke-width="3"/></g>
  </g>
  <text x="600" y="750" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600" fill="#374151" text-anchor="middle">15 Tables × 8 seats each</text>
</svg>
