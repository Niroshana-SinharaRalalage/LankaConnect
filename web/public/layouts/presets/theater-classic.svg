  <g fill="#3b82f6" stroke="#1e40af" stroke-width="1">
    <!-- rows -->
    <g id="seat-grid"></g>
  </g>
  <!-- 200 seat dots generated via explicit rows below (kept short via fractional grid): -->
  <g fill="#6366f1">
    <!-- We use <use> patterns per row for compactness -->
  </g>
