name: Deploy to Azure Production

on:
  push:
    branches:
      - main  # Production deploys only from main branch
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (emergency deployment only)'
        required: false
        default: 'false'
  # Reusable trigger so deploy-production-with-approval.yml can call this
  # workflow via `uses: ./.github/workflows/deploy-production.yml`. Without
  # this trigger, the wrapper dispatch fails with "workflow is not reusable
  # as it is missing a `on.workflow_call` trigger".
  workflow_call:

env:
  AZURE_CONTAINER_REGISTRY: lankaconnectprod
  CONTAINER_APP_NAME: lankaconnect-api-prod
  RESOURCE_GROUP: lankaconnect-prod
  KEY_VAULT_NAME: lankaconnect-prod-kv
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ========================================================================
      # PHASE 1: BUILD AND TEST
      # ========================================================================

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build -c Release --no-restore

      - name: Run unit tests (MANDATORY for production)
        if: github.event.inputs.skip_tests != 'true'
        run: |
          dotnet test tests/LankaConnect.Application.Tests/LankaConnect.Application.Tests.csproj \
            --no-restore \
            --verbosity normal \
            --logger "console;verbosity=detailed"
          echo "✅ All tests passed - Zero Tolerance enforced"

      - name: Test results summary
        if: always()
        run: |
          if [ "${{ github.event.inputs.skip_tests }}" = "true" ]; then
            echo "⚠️  WARNING: Tests skipped (emergency deployment)"
          else
            echo "✅ Unit tests completed successfully"
          fi

      # ========================================================================
      # PHASE 2: AZURE AUTHENTICATION AND IMAGE BUILD
      # ========================================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME_PROD }}
          password: ${{ secrets.ACR_PASSWORD_PROD }}

      - name: Publish application
        run: |
          dotnet publish src/LankaConnect.API/LankaConnect.API.csproj \
            -c Release \
            -o src/LankaConnect.API/publish \
            --no-restore

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/lankaconnect-api:${{ github.sha }} \
            -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/lankaconnect-api:production \
            -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/lankaconnect-api:latest \
            -f src/LankaConnect.API/Dockerfile.simple .

      - name: Push Docker image
        run: |
          docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/lankaconnect-api:${{ github.sha }}
          docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/lankaconnect-api:production
          docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/lankaconnect-api:latest

      # ========================================================================
      # PHASE 3: DATABASE MIGRATION
      # ========================================================================

      - name: Validate Key Vault secrets
        id: keyvault
        run: |
          echo "Validating Key Vault secrets..."
          az keyvault secret show --vault-name ${{ env.KEY_VAULT_NAME }} --name database-connection-string --query value -o tsv > /dev/null
          az keyvault secret show --vault-name ${{ env.KEY_VAULT_NAME }} --name jwt-secret-key --query value -o tsv > /dev/null
          echo "✅ Key Vault secrets validated"

      - name: Run EF Core migrations
        run: |
          dotnet tool install -g dotnet-ef --version 8.0.0 2>/dev/null || dotnet tool update -g dotnet-ef --version 8.0.0

          DB_CONNECTION=$(az keyvault secret show \
            --vault-name ${{ env.KEY_VAULT_NAME }} \
            --name database-connection-string \
            --query value -o tsv)

          echo "Applying pending migrations to production database..."
          cd src/LankaConnect.API

          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Migration attempt $RETRY_COUNT of $MAX_RETRIES..."

            if dotnet ef database update \
              --connection "$DB_CONNECTION" \
              --project ../LankaConnect.Infrastructure/LankaConnect.Infrastructure.csproj \
              --context AppDbContext \
              --verbose; then
              SUCCESS=true
              echo "✅ Migrations completed successfully"
            else
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                DELAY=$((10 * (2 ** ($RETRY_COUNT - 1))))
                echo "⚠️  Migration failed. Retrying in ${DELAY}s..."
                sleep $DELAY
              else
                echo "❌ Migration failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

      # ========================================================================
      # PHASE 4: DEPLOY CONTAINER APP (Direct Deployment)
      # ========================================================================

      - name: Update Container App
        run: |
          # Phase 6A.141 F6 PRE-FLIGHT: ensure the Container App has a secret named
          # ticket-qr-signing-key that references the Key Vault secret
          # TICKET-QR-SIGNING-KEY. Idempotent — noop if already configured.
          # MUST run BEFORE the env-var update because the env var references this
          # secret by name; otherwise the update fails with "secret not found".
          # Uses the system-assigned managed identity already wired up for KV access.
          # SEV-1 SAFETY RAIL: without this binding the API silently falls back to
          # the dev-only base64 key checked into appsettings.json line 205 —
          # production QRs would be forgeable by anyone who can read the repo.
          az containerapp secret set \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets "ticket-qr-signing-key=keyvaultref:https://${{ env.KEY_VAULT_NAME }}.vault.azure.net/secrets/TICKET-QR-SIGNING-KEY,identityref:system" \
            > /dev/null
          echo "✓ Container App secret ticket-qr-signing-key wired (Phase 6A.141 F6)"

          echo "Deploying new image to production..."

          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/lankaconnect-api:${{ github.sha }} \
            --replace-env-vars \
              ASPNETCORE_ENVIRONMENT=Production \
              ConnectionStrings__DefaultConnection=secretref:database-connection-string \
              ConnectionStrings__Redis=localhost:6379 \
              Jwt__Key=secretref:jwt-secret-key \
              Jwt__Issuer=secretref:jwt-issuer \
              Jwt__Audience=secretref:jwt-audience \
              EntraExternalId__IsEnabled=secretref:entra-enabled \
              EntraExternalId__TenantId=secretref:entra-tenant-id \
              EntraExternalId__ClientId=secretref:entra-client-id \
              EntraExternalId__Audience=secretref:entra-audience \
              EmailSettings__Provider=Azure \
              EmailSettings__AzureConnectionString=secretref:azure-email-connection-string \
              EmailSettings__AzureSenderAddress=secretref:azure-email-sender-address \
              EmailSettings__AzureEventsSenderAddress=secretref:azure-email-events-sender-address \
              EmailSettings__SenderName="LankaConnect" \
              EmailSettings__TemplateBasePath=Templates/Email \
              AzureStorage__ConnectionString=secretref:azure-storage-connection-string \
              Stripe__SecretKey=secretref:stripe-secret-key \
              Stripe__PublishableKey=secretref:stripe-publishable-key \
              Stripe__WebhookSecret=secretref:stripe-webhook-secret \
              Refund__ApprovalWorkflow__Enabled=true \
              WhatsAppSettings__Enabled=true \
              WhatsAppSettings__Provider=Twilio \
              WhatsAppSettings__TwilioAccountSid=secretref:twilio-account-sid \
              WhatsAppSettings__TwilioAuthToken=secretref:twilio-auth-token \
              WhatsAppSettings__TwilioWhatsAppNumber=secretref:twilio-whatsapp-number \
              WhatsAppSettings__TwilioContentSids__phone_verification=HX67ba357847341b891d999b583fc6fa27 \
              WhatsAppSettings__TwilioContentSids__signup_commitment_cancelled=HX583663d48d5e71afd843cd10af71f3d9 \
              WhatsAppSettings__TwilioContentSids__form_response_confirmed=HX73c2be44d9156b9f09329cbc2edf9967 \
              WhatsAppSettings__TwilioContentSids__new_event_announcement=HX346704719517ae90010e5af0570346f9 \
              WhatsAppSettings__TwilioContentSids__sponsor_confirmation=HX20aadc3c70aad42d007d456393b18269 \
              WhatsAppSettings__TwilioContentSids__signup_commitment_confirmed=HXf555fb5ec6d9ec22cc20afdc5b37efcf \
              WhatsAppSettings__TwilioContentSids__event_postponed=HX6fbb78f220b1fad588eb554884df8ace \
              WhatsAppSettings__TwilioContentSids__collection_receipt=HXfa788d215e3739978bc0e837a5dd864e \
              WhatsAppSettings__TwilioContentSids__donation_receipt=HX047ecfcf57f8409867414d52d4d069e7 \
              WhatsAppSettings__TwilioContentSids__event_details_update=HX554ee6ca19282dbb670e82ba8ecd68c7 \
              WhatsAppSettings__TwilioContentSids__event_registration_confirmed=HXa898bf71c087e6f91e130e5b170d1033 \
              WhatsAppSettings__TwilioContentSids__event_rejected=HXf5e67da914651a258a9a3e1e3f7e0d2e \
              WhatsAppSettings__TwilioContentSids__refund_completed=HXdd7156e4f441b22ec3b1b7568dc88a32 \
              WhatsAppSettings__TwilioContentSids__registration_cancelled=HXf076845bb071e8faa76027d645f08ff0 \
              WhatsAppSettings__TwilioContentSids__signup_commitment_updated=HXe2d512a4ad9a9a7aae54b8ed78028a3f \
              WhatsAppSettings__TwilioContentSids__event_cancelled=HX449794c395b6fc477d07e649bfc8987a \
              WhatsAppSettings__TwilioContentSids__payment_pending_reminder=HX52466feb7e5397299bc12bcb681798f0 \
              WhatsAppSettings__TwilioContentSids__attendees_added=HX8c6ebc13c382e9b01d1b1d05c9e4bc60 \
              WhatsAppSettings__TwilioContentSids__addon_purchase_receipt=HXfc46ec741cc014693f301fe5ea0aec37 \
              WhatsAppSettings__TwilioContentSids__event_reminder=HX241cf0441f30b72197fef80328750baa \
              WhatsAppSettings__TwilioContentSids__refund_initiated=HXb07ab748e3bf50fe659bc89dd0327375 \
              WhatsAppSettings__TwilioContentSids__event_approved=HX81ec1d4f558447d762ab15e451b6325b \
              WhatsAppSettings__TwilioContentSids__newsletter_broadcast=HX17b7b6276a4cd5e9967bff89bf145c22 \
              WhatsAppSettings__TwilioContentSids__event_ticket_confirmation=HXb161bc8eb956f4637ab4f961d4d08ca4 \
              WhatsAppSettings__TwilioContentSids__photo_album_published=HXcbb9d987a5953d9e7465f994f0d72dd5 \
              Tickets__QrSigningKey=secretref:ticket-qr-signing-key

          # Ensure ingress is configured for port 5000
          az containerapp ingress update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --target-port 5000

      - name: Verify Container App scale rules (Phase 8 perf-RCA hygiene)
        run: |
          # Phase 8 (post-prod-perf-RCA hygiene): the 2026-04-25 prod incident
          # was amplified by an empty scaleRules block — KEDA never spawned
          # replica #2 fast enough and Envoy queues went into a 503 cascade.
          # This gate fails the deploy job if the Container App's scale rules
          # are missing or empty, so the same drift can never silently happen
          # again. See docs/MASTER_TODO_PROD_PERF_RCA_2026_04_25.md.
          echo "════════════════════════════════════════════════════════════════"
          echo "Verifying Container App scale rules are configured"
          echo "════════════════════════════════════════════════════════════════"

          SCALE_RULES_JSON=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.template.scale.rules" -o json)

          if [ -z "$SCALE_RULES_JSON" ] || [ "$SCALE_RULES_JSON" = "null" ] || [ "$SCALE_RULES_JSON" = "[]" ]; then
            echo "❌ Container App scale rules are NULL or EMPTY — this triggered"
            echo "   the 2026-04-25 prod incident. Refusing to ship without an"
            echo "   http-scaler rule. Add scale-rule config via 'az containerapp"
            echo "   update --scale-rule-*' or in IaC, then re-run."
            exit 1
          fi

          echo "✅ Container App scale rules configured:"
          echo "$SCALE_RULES_JSON" | jq '.'

      - name: Wait for deployment
        run: |
          echo "Waiting 30 seconds for Container App to update..."
          sleep 30

      # ========================================================================
      # PHASE 5: POST-DEPLOYMENT VALIDATION
      # ========================================================================

      - name: Get production URL
        id: get-url
        run: |
          URL=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "PROD_URL=https://$URL" >> $GITHUB_OUTPUT
          echo "Production URL: https://$URL"

      - name: Final smoke test (production URL)
        run: |
          echo "Testing production URL..."
          curl --fail --retry 3 --retry-delay 5 \
            ${{ steps.get-url.outputs.PROD_URL }}/health || exit 1
          echo "✅ Production health check passed"

      - name: Test Entra endpoint (production)
        run: |
          echo "Testing Entra login endpoint on production..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST ${{ steps.get-url.outputs.PROD_URL }}/api/auth/login/entra \
            -H "Content-Type: application/json" \
            -d '{"accessToken":"invalid","ipAddress":"127.0.0.1"}')

          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 400 ] || [ "$HTTP_CODE" -eq 401 ]; then
            echo "✅ Entra endpoint responding correctly (HTTP $HTTP_CODE)"
          else
            echo "❌ Unexpected response code: $HTTP_CODE"
            exit 1
          fi

      # ========================================================================
      # PHASE 6: DEPLOYMENT SUMMARY AND NOTIFICATIONS
      # ========================================================================

      - name: Deployment summary
        if: success()
        run: |
          echo "════════════════════════════════════════════════════════════════"
          echo "✅ PRODUCTION DEPLOYMENT SUCCESSFUL!"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          echo "Environment:        Production"
          echo "URL:                ${{ steps.get-url.outputs.PROD_URL }}"
          echo "Image:              ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/lankaconnect-api:${{ github.sha }}"
          echo "Commit:             ${{ github.sha }}"
          echo "Branch:             ${{ github.ref_name }}"
          echo "Deployed by:        ${{ github.actor }}"
          echo ""
          echo "Deployment Strategy: Direct deployment with smoke tests"
          echo "  1. ✅ Build and tests passed"
          echo "  2. ✅ Database migrations applied"
          echo "  3. ✅ Container App updated"
          echo "  4. ✅ Smoke tests passed"
          echo ""
          echo "Post-Deployment Actions:"
          echo "  1. Monitor Application Insights for errors"
          echo "  2. Check Container App logs: az containerapp logs show --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --follow"
          echo "  3. Test critical user flows (login, event creation, payments)"
          echo ""
          echo "════════════════════════════════════════════════════════════════"

      # ========================================================================
      # PHASE 7: FAILURE HANDLING
      # ========================================================================

      - name: Get Container App Logs on Failure
        if: failure()
        run: |
          echo "Fetching Container App logs for debugging..."
          az containerapp logs show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --tail 100 || echo "Failed to fetch logs"

      - name: Notify on failure
        if: failure()
        run: |
          echo "════════════════════════════════════════════════════════════════"
          echo "❌ PRODUCTION DEPLOYMENT FAILED!"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          echo "Commit:     ${{ github.sha }}"
          echo "Actor:      ${{ github.actor }}"
          echo "Workflow:   ${{ github.workflow }}"
          echo "Run ID:     ${{ github.run_id }}"
          echo ""
          echo "Common issues:"
          echo "  - Unit tests failed (Zero Tolerance enforced)"
          echo "  - Database migration failed"
          echo "  - Docker build failed"
          echo "  - Container App update failed"
          echo "  - Health check endpoint not responding"
          echo "  - New revision did not become healthy"
          echo ""
          echo "Next Steps:"
          echo "  1. Review logs above for specific error"
          echo "  2. Fix issue in code"
          echo "  3. Test locally with staging environment"
          echo "  4. Push fix to main branch"
          echo "  5. Monitor new deployment closely"
          echo ""
          echo "════════════════════════════════════════════════════════════════"
